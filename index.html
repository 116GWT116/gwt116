<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高炜彤 · 作品集</title>
<meta name="description" content="高炜彤的作品集：新媒体运营 / 视觉设计 / 游戏内容运营。项目包括东华招生网、行印旅行影像记录工具等。">
<style>
  /* ===== 基础：纯白底、黑白灰、单一无衬线 + 数字衬线 ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #FFFFFF;
    color: #111111;
    font-family: "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
  }
  main { max-width: 820px; margin: 0 auto; padding: 132px 40px 88px; }

  /* ===== 页头 ===== */
  h1 { margin: 0; font-size: 40px; font-weight: 600; letter-spacing: 5px; }
  .role { margin: 18px 0 0; font-size: 15px; letter-spacing: 2.5px; color: #555; }
  .meta { margin: 10px 0 0; font-size: 13px; letter-spacing: 1px; color: #9a9a9a; }

  /* ===== 简介 ===== */
  .about { margin-top: 64px; }
  .about p { margin: 0; max-width: 60ch; font-size: 16px; line-height: 2.05; color: #333; }

  /* ===== 区块标题（细线通栏） ===== */
  .sec { margin-top: 84px; }
  .sec-label {
    font-size: 11px; letter-spacing: 3px; color: #8c8c8c;
    padding-bottom: 14px; border-bottom: 1px solid #111111;
  }

  /* ===== 作品列表 ===== */
  .list { list-style: none; margin: 0; padding: 0; }
  .row a {
    display: grid;
    grid-template-columns: 56px 210px minmax(0, 1fr) 56px 64px;
    align-items: baseline;
    column-gap: 22px;
    padding: 28px 0;
    border-bottom: 1px solid rgba(0, 0, 0, 0.13);
    text-decoration: none;
    color: inherit;
  }
  .no {
    font-family: "Times New Roman", Times, serif;
    font-size: 30px; font-weight: 400; color: #111111; line-height: 1;
  }
  .ttl { font-size: 21px; font-weight: 500; letter-spacing: 1px; }
  .desc { font-size: 14px; color: #767676; line-height: 1.75; }
  .yr { font-size: 13px; color: #9a9a9a; text-align: right; letter-spacing: 0.5px; }
  .go { font-size: 14px; text-align: right; color: #111111; white-space: nowrap; }
  .row a:hover .go { text-decoration: underline; text-underline-offset: 4px; }
  .row a:hover .no { color: #8c8c8c; }

  /* 未发布条目（无链接） */
  .row.plain > div {
    display: grid;
    grid-template-columns: 56px 210px minmax(0, 1fr) 56px 64px;
    align-items: baseline;
    column-gap: 22px;
    padding: 28px 0;
    border-bottom: 1px solid rgba(0, 0, 0, 0.13);
    color: #8c8c8c;
  }
  .row.plain .ttl { color: #555; font-weight: 400; }
  .tag { font-size: 12px; letter-spacing: 1px; color: #a8a8a8; text-align: right; }

  /* ===== 页脚 ===== */
  footer {
    margin-top: 104px; padding-top: 22px; border-top: 1px solid rgba(0, 0, 0, 0.13);
    font-size: 12px; letter-spacing: 1px; color: #a8a8a8;
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }

  /* ===== 移动端 ===== */
  @media (max-width: 680px) {
    main { padding: 76px 22px 56px; }
    h1 { font-size: 30px; letter-spacing: 3px; }
    .about { margin-top: 44px; }
    .sec { margin-top: 56px; }
    .row a, .row.plain > div {
      grid-template-columns: 44px 1fr auto;
      grid-template-areas:
        "no ttl go"
        ".  desc desc"
        ".  yr   yr";
      row-gap: 8px; column-gap: 14px;
      padding: 22px 0;
    }
    .no { font-size: 22px; }
    .ttl { font-size: 18px; }
    .desc { grid-area: desc; font-size: 13px; }
    .yr { grid-area: yr; text-align: left; }
    .go { grid-area: go; }
    .row .no { grid-area: no; }
    .row .ttl { grid-area: ttl; }
  }
</style>
</head>
<body>
<main>

  <header>
    <h1>高炜彤</h1>
    <p class="role">新媒体运营 · 视觉设计 · 游戏内容运营</p>
    <p class="meta">东华大学 · 网络与新媒体 · 上海</p>
  </header>

  <section class="about">
    <p>做内容、做设计，也自己写页面。这里是我在做的项目 —— 从校园招生的内容策划与页面更新，到旅行影像记录的交互工具，再到用运营视角拆解游戏。</p>
  </section>

  <section class="sec">
    <div class="sec-label">作品 / WORKS</div>
    <ul class="list">
      <li class="row">
        <a href="dhu-admissions/">
          <span class="no">01</span>
          <span class="ttl">东华招生网</span>
          <span class="desc">招生信息的内容策划与页面更新维护</span>
          <span class="yr">2026</span>
          <span class="go">查看 →</span>
        </a>
      </li>
      <li class="row plain">
        <div>
          <span class="no">02</span>
          <span class="ttl">行印</span>
          <span class="desc">旅行影像记录工具 · 票证入口 + 地图足迹</span>
          <span class="yr">2026</span>
          <span class="tag">整理中</span>
        </div>
      </li>
      <li class="row plain">
        <div>
          <span class="no">03</span>
          <span class="ttl">游戏内容拆解</span>
          <span class="desc">用运营视角拆解游戏的设计与节奏</span>
          <span class="yr">2026</span>
          <span class="tag">整理中</span>
        </div>
      </li>
    </ul>
  </section>

  <footer>
    <span>© 2026 高炜彤</span>
    <span>HTML / CSS 手写 · 托管于 GitHub Pages</span>
  </footer>

</main>
</body>
</html>
